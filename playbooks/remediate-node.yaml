---
- name: Remediate Degraded Node
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    node_name: "{{ node_name }}"
    k8s_host: "https://kubernetes.default.svc"
    k8s_token_file: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    k8s_ca_file: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

  tasks:
    - name: Read service account token
      ansible.builtin.set_fact:
        k8s_api_key: "{{ lookup('file', k8s_token_file) }}"

    - name: Get current node conditions
      kubernetes.core.k8s_info:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        kind: Node
        name: "{{ node_name }}"
      register: node_info

    - name: Display node conditions
      ansible.builtin.debug:
        msg: >
          Node {{ node_name }} conditions:
          {% for c in node_info.resources[0].status.conditions %}
          {{ c.type }}={{ c.status }}
          {% endfor %}

    - name: Cordon the node
      kubernetes.core.k8s_drain:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        state: cordon
        name: "{{ node_name }}"

    - name: Drain the node
      kubernetes.core.k8s_drain:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        state: drain
        name: "{{ node_name }}"
        delete_options:
          delete_emptydir_data: true
          ignore_daemonsets: true
          terminate_grace_period: 30

    - name: Wait for node conditions to stabilize
      kubernetes.core.k8s_info:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        kind: Node
        name: "{{ node_name }}"
      register: node_post_drain
      until: >
        node_post_drain.resources[0].status.conditions |
        selectattr('type', 'equalto', 'MemoryPressure') |
        map(attribute='status') | first == "False"
      retries: 20
      delay: 15
      ignore_errors: true

    - name: Uncordon the node
      kubernetes.core.k8s_drain:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        state: uncordon
        name: "{{ node_name }}"

    - name: Verify node is Ready
      kubernetes.core.k8s_info:
        host: "{{ k8s_host }}"
        api_key: "{{ k8s_api_key }}"
        ca_cert: "{{ k8s_ca_file }}"
        kind: Node
        name: "{{ node_name }}"
      register: node_final
      until: >
        node_final.resources[0].status.conditions |
        selectattr('type', 'equalto', 'Ready') |
        map(attribute='status') | first == "True"
      retries: 10
      delay: 10

    - name: Report result
      ansible.builtin.debug:
        msg: "Node {{ node_name }} remediation complete. Node is Ready and schedulable."
