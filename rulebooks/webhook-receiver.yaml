---
- name: Receive AlertManager Webhooks
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001

  rules:
    - name: Log Firing Alert
      condition: event.payload.status is defined and event.payload.status == "firing"
      action:
        debug:
          msg: "ALERT FIRING: {{ event.payload.alerts[0].labels.alertname | default('unknown') }} on {{ event.payload.alerts[0].labels.node | default('unknown') }}"

    - name: Log Resolved Alert
      condition: event.payload.status is defined and event.payload.status == "resolved"
      action:
        debug:
          msg: "ALERT RESOLVED: {{ event.payload.alerts[0].labels.alertname | default('unknown') }}"
