---
- name: Receive AlertManager Webhooks and Trigger Self-Healing
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001

  rules:
    - name: Forward Alert to AI Agent via AAP
      condition: event.payload.status is defined and event.payload.status == "firing"
      action:
        run_job_template:
          name: "Trigger Self-Healing Agent"
          organization: Default
          job_args:
            extra_vars:
              event_type: "{{ event.payload.alerts[0].labels.alertname | default('unknown') }}"
              node_name: "{{ event.payload.alerts[0].labels.node | default(event.payload.alerts[0].labels.instance | default('unknown')) }}"
              severity: "{{ event.payload.alerts[0].labels.severity | default('warning') }}"

    - name: Log Resolved Alerts
      condition: event.payload.status is defined and event.payload.status == "resolved"
      action:
        debug:
          msg: "ALERT RESOLVED: {{ event.payload.alerts[0].labels.alertname | default('unknown') }}"
